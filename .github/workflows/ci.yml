name: CI

# Quoted so YAML 1.1 parsers do not fold `on` into boolean true.
"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      unsigned:
        description: "Publish as an ad-hoc-signed prerelease (not Developer ID signed)"
        type: boolean
        default: false
# NOTE: the source uses macOS 27 SDK APIs (NSSegmentedControl.role etc.),
# so this workflow needs an Xcode 27 toolchain. macOS 27 has shipped, but
# GitHub's hosted runners label it `xcode-27` (public preview, arm64) — not
# `macos-27`. If a plain `macos-27` label appears later, this can switch back.
# Note: `swift test` no longer needs the release signing key (UpdateChecker
# tests use a self-contained key pair), so a clean runner can run the full
# suite as-is.
#
# Actions are pinned to major tags that ship on the Node.js 24 runtime
# (checkout >= v5, cache >= v5, upload-artifact >= v6); the Node.js 20
# releases are deprecated and get force-upgraded by the runner.
permissions:
  contents: read

env:
  SWIFT_DETERMINISTIC_HASHING: "1"

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SwiftPM builds are expensive (~minutes); cache the build dir keyed on
      # the manifest and source hashes so the repeated gate steps reuse the
      # compiled product.
      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ hashFiles('Package.swift') }}-

      - name: Swift build (debug)
        run: swift build

      - name: Swift test
        run: swift test

      # Re-open a pre-versioned fixture through the real migration path and
      # replay canonical rows. These are deterministic, data-loss-sensitive
      # gates rather than timing assumptions about a hosted runner.
      - name: Migration replay gate
        run: |
          swift test --filter DatabaseTests.testSubscriptionIDZeroMigration
          swift test --filter DatabaseTests.testCanonicalEventSupersedesDerivedMigrationRow

      - name: Duplicate import gate
        run: swift test --filter ClaudeCodeParserTests.testRepeatedTranscriptRowsShareMessageIdentity

      # Release compilation catches optimizer-only regressions in the scanner
      # and parser hot paths without asserting a wall-clock budget on CI.
      - name: Release performance smoke gate
        run: swift test -c release --filter FileScannerTests

      - name: Strict concurrency gate
        run: swift build -Xswiftc -strict-concurrency=complete

      # Four dashboard pages, the popover, and two settings panes in light/dark.
      # Average-hash comparison tolerates minor antialiasing changes while
      # still catching blank renders and structural layout regressions.
      - name: Visual regression gate
        env:
          TM_VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/visual-regression-failure
        run: xcrun swift scripts/visual-regression.swift compare

      - name: Upload failing popover captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-regression-failure/*.png
          if-no-files-found: ignore

  release-bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: xcode-27
    permissions:
      contents: write
    # The normal tag-push path requires this identity. Unsigned builds are
    # available only by explicitly dispatching this workflow for a tag.
    env:
      TM_SIGNING_IDENTITY: ${{ secrets.TM_SIGNING_IDENTITY }}
      TM_ALLOW_UNSIGNED: ${{ inputs.unsigned && '1' || '' }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate semantic release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          [[ "$tag" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || {
            echo "release tags must be vMAJOR.MINOR or vMAJOR.MINOR.PATCH" >&2
            exit 1
          }

      - name: Require a release signing mode
        run: |
          if [[ "$TM_ALLOW_UNSIGNED" == "1" && "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Explicit manual opt-in: publishing an ad-hoc-signed prerelease."
          elif [[ -n "$TM_SIGNING_IDENTITY" && "$TM_ALLOW_UNSIGNED" != "1" ]]; then
            echo "Release signing identity is configured."
          else
            echo "::error::TM_SIGNING_IDENTITY is required for tag releases. To publish an unsigned prerelease, manually run this workflow for the tag with unsigned=true."
            exit 1
          fi

      - name: Assemble app zips
        if: ${{ env.TM_SIGNING_IDENTITY != '' || env.TM_ALLOW_UNSIGNED == '1' }}
        env:
          TM_VERSION: ${{ github.ref_name }}
          TM_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-release.sh

      - name: Verify release archives
        if: ${{ env.TM_SIGNING_IDENTITY != '' || env.TM_ALLOW_UNSIGNED == '1' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in arm64 universal; do
            archive="dist/release/ToastMonitor-${version}-${arch}.zip"
            if [[ ! -s "$archive" ]]; then
              echo "::error::Missing or empty release archive: $archive"
              exit 1
            fi
            unzip -tq "$archive" >/dev/null
          done

      - name: Publish GitHub Release
        if: ${{ env.TM_SIGNING_IDENTITY != '' || env.TM_ALLOW_UNSIGNED == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archives=(
            "dist/release/ToastMonitor-${version}-arm64.zip"
            "dist/release/ToastMonitor-${version}-universal.zip"
          )
          flags=(--generate-notes)
          if [[ "$TM_ALLOW_UNSIGNED" == "1" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${archives[@]}" \
            --title "ToastMonitor $GITHUB_REF_NAME" "${flags[@]}"
