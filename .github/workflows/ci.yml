name: CI

# Quoted so YAML 1.1 parsers do not fold `on` into boolean true.
"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# NOTE: the source uses macOS 27 SDK APIs (NSSegmentedControl.role etc.),
# so this workflow needs an Xcode 27 toolchain. GitHub's hosted runners do
# not ship one until macOS 27 is released; until then this workflow stays
# disabled (disable via Settings -> Actions, or `gh api -X PUT
# repos/<owner>/<repo>/actions/workflows/ci.yml/disable`). When macOS 27
# lands, switch `runs-on` to macos-27 and re-enable.
# Note: `swift test` no longer needs the release signing key (UpdateChecker
# tests use a self-contained key pair), so a clean runner can run the full
# suite as-is.
permissions:
  contents: read

env:
  SWIFT_DETERMINISTIC_HASHING: "1"

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SwiftPM builds are expensive (~minutes); cache the build dir keyed on
      # the manifest and source hashes so the repeated gate steps reuse the
      # compiled product.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ hashFiles('Package.swift') }}-

      - name: Swift build (debug)
        run: swift build

      - name: Swift test
        run: swift test

      # Re-open a pre-versioned fixture through the real migration path and
      # replay canonical rows. These are deterministic, data-loss-sensitive
      # gates rather than timing assumptions about a hosted runner.
      - name: Migration replay gate
        run: |
          swift test --filter DatabaseTests.testSubscriptionIDZeroMigration
          swift test --filter DatabaseTests.testCanonicalEventSupersedesDerivedMigrationRow

      - name: Duplicate import gate
        run: swift test --filter ClaudeCodeParserTests.testRepeatedTranscriptRowsShareMessageIdentity

      # Release compilation catches optimizer-only regressions in the scanner
      # and parser hot paths without asserting a wall-clock budget on CI.
      - name: Release performance smoke gate
        run: swift test -c release --filter FileScannerTests

      - name: Strict concurrency gate
        run: swift build -Xswiftc -strict-concurrency=complete

  release-bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: macos-26
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semantic release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          [[ "$tag" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || {
            echo "release tags must be vMAJOR.MINOR or vMAJOR.MINOR.PATCH" >&2
            exit 1
          }

      - name: Assemble signed app
        if: ${{ secrets.TM_SIGNING_IDENTITY != '' }}
        env:
          TM_VERSION: ${{ github.ref_name }}
          TM_BUILD_NUMBER: ${{ github.run_number }}
          TM_SIGNING_IDENTITY: ${{ secrets.TM_SIGNING_IDENTITY }}
        run: ./scripts/build-app.sh

      - name: Upload app bundle
        if: ${{ secrets.TM_SIGNING_IDENTITY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ToastMonitor-${{ github.ref_name }}
          path: dist/ToastMonitor.app
