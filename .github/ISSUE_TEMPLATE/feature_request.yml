name: Feature request
description: Suggest an idea for ToastMonitor
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear description of the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should it work? Include UI placement and data semantics if relevant.
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: Stays local-only by default (no implicit network calls or analytics)
        - label: Adds no third-party dependency
    validations:
      required: false
